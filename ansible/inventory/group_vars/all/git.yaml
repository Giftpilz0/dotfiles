---
# user.name/email: ~/.gitconfig via chezmoi
git_config_system:
  - key: init.defaultBranch
    value: main
  - key: core.editor
    value: hx
  - key: core.whitespace
    value: fix,-indent-with-non-tab,trailing-space,cr-at-eol
  - key: color.ui
    value: auto
  - key: gpg.program
    value: /usr/bin/gpg
