---
######################################
### giftpilz0.general.git

git_config_system:
  - key: init.defaultBranch
    value: main
  - key: core.editor
    value: hx
  - key: core.whitespace
    value: fix,-indent-with-non-tab,trailing-space,cr-at-eol
  - key: color.ui
    value: auto
  - key: gpg.program
    value: /usr/bin/gpg

git_config:
  - key: user.name
    value: "{{ git_user_name }}"
    scope: global
  - key: user.email
    value: "{{ git_user_email }}"
    scope: global

######################################
### giftpilz0.general.timezone

timezone_timezone: Europe/Berlin

######################################
### giftpilz0.general.packages

packages_python_package:
  - pre-commit

packages_flatpak_repos:
  - name: flathub
    flatpakrepo_url: "https://dl.flathub.org/repo/flathub.flatpakrepo"
    state: present

packages_flatpak_repos_remove:
  - fedora
  - fedora-testing

packages_flatpak_package:
  - name: dev.zed.Zed
    state: present
    remote: flathub
  - name: io.github.kolunmi.Bazaar
    state: present
    remote: flathub

######################################
### giftpilz0.general.firewalld

firewalld_zones_define:
  - zone: work
    source: 192.168.10.0/24
    target: DROP

firewalld_rules_services:
  - service: ssh
    zone: work
    state: disabled
