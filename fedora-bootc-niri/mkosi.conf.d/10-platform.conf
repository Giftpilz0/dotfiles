# Static mkosi/bootc settings. Package content is rendered from
# ansible/vars/package-manifest.json into 20-content.conf.

[Match]
Distribution=fedora

[Content]
WithRecommends=true
Bootable=no
KernelCommandLine=
VolatilePackages=
    systemd
    systemd-udev
    systemd-container
    systemd-oomd-defaults
    systemd-pam
    systemd-resolved

[Build]
ToolsTreePackages=ostree
SandboxTrees=
    repos/giftpilz0-misc.repo:/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:giftpilz0:misc.repo
    repos/ublue-os-packages.repo:/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:ublue-os:packages.repo

[Distribution]
Repositories=
    copr:copr.fedorainfracloud.org:giftpilz0:misc
    copr:copr.fedorainfracloud.org:ublue-os:packages

[Output]
Format=oci

[Match]
Distribution=fedora
Release=!rawhide

[Distribution]
Repositories=updates-testing
