# Factory symlinks for container signing policy
# These are managed via factory so that users can still override them in /etc
L+ /etc/containers/policy.json - - - - /usr/share/factory/etc/containers/policy.json
L+ /etc/containers/registries.d/fedora-bootc-niri.yaml - - - - /usr/share/factory/etc/containers/registries.d/fedora-bootc-niri.yaml

# Flatpak repository definition
d /etc/flatpak/remotes.d 0755 root root -
L+ /etc/flatpak/remotes.d/flathub.flatpakrepo - - - - /usr/share/flatpak/remotes.d/flathub.flatpakrepo
