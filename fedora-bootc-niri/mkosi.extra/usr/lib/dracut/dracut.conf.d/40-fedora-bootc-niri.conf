# Build a generic initramfs for a server-side bootc image.
reproducible=yes
hostonly=no
compress=zstd

# dracut cannot set SELinux xattrs in the mkosi build root.
export DRACUT_NO_XATTR=1

# Modules:
# - kernel-modules, dracut-systemd, systemd-initrd, base, ostree: bootc boot flow
# - lvm, dm, crypt, fips: storage and encrypted installs
# - virtiofs: common VM/dev environments
# - tpm2-tss, fido2, pkcs11: hardware-backed unlock and passkeys
add_dracutmodules+=" kernel-modules dracut-systemd systemd-initrd base ostree lvm dm crypt fips virtiofs tpm2-tss fido2 pkcs11 "
