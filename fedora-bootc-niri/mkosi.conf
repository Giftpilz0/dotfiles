[Config]
MinimumVersion=26~devel

[Distribution]
Distribution=fedora
Release=44

[Build]
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Runtime]
RuntimeSize=30G
RAM=4G
CPUs=4

[Output]
ImageId=fedora-bootc-niri
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a
