---
name: Build image

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "Justfile"
      - "README.md"
      - "fedora-bootc-niri/**"
  schedule:
    - cron: "0 1 * * TUE"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: fedora-bootc-niri
  IMAGE_TAG: latest
  IMAGE_FULL: localhost/fedora-bootc-niri:latest
  REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/fedora-bootc-niri

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Cache mkosi
        uses: actions/cache@v5
        with:
          path: fedora-bootc-niri/mkosi.cache
          key: ${{ runner.os }}-mkosi-${{ env.IMAGE_NAME }}-${{ hashFiles('fedora-bootc-niri/**', 'Justfile') }}
          restore-keys: |
            ${{ runner.os }}-mkosi-${{ env.IMAGE_NAME }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl bubblewrap debian-archive-keyring python3-pip uidmap
          python3 -m pip install --break-system-packages git+https://github.com/systemd/mkosi

      - name: Enable user namespaces for mkosi
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build image
        run: just build

      - name: Load image
        run: just load

      - name: Lint image
        run: just lint

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | podman login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        run: |
          podman tag "${IMAGE_FULL}" "${REMOTE_IMAGE}:${IMAGE_TAG}"
          podman tag "${IMAGE_FULL}" "${REMOTE_IMAGE}:${GITHUB_SHA}"
          podman push --digestfile=/tmp/digestfile "${REMOTE_IMAGE}:${IMAGE_TAG}"
          podman push "${REMOTE_IMAGE}:${GITHUB_SHA}"
          echo "digest=$(cat /tmp/digestfile)" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

      - name: Sign image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY "${REMOTE_IMAGE}@${{ steps.push.outputs.digest }}"
