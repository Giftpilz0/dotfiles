# https://github.com/Abhra00/Matuprland
# https://github.com/AvengeMedia/DankMaterialShell/tree/master/quickshell/matugen/templates

[config]

# Wofi
[templates.wofi]
input_path = '~/.config/matugen/templates/common.css'
output_path = '~/.config/wofi/matugen/colors.css'

# Niri
[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/dms/colors.kdl'

# Quickshell
[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.qml'
output_path = '~/.config/quickshell/common/Color.qml'

# Fuzzel
[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/colors.ini'
